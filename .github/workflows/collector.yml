name: ETH Coinalyze Collector

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/collector.yml"
      - "collector.py"

  schedule:
    - cron: "37 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: eth-coinalyze-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Run collector
        env:
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
        run: python collector.py

      - name: Commit updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eth_hourly.csv
          git diff --cached --quiet || git commit -m "Update ETH hourly data"
          git push

      - name: Schedule next run in about 10 minutes
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_REF: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          NOW_MIN=$(date -u +%M)
          NOW_SEC=$(date -u +%S)
          MIN=$((10#$NOW_MIN))
          SEC=$((10#$NOW_SEC))
          WAIT_MIN=$((10 - (MIN % 10)))
          if [ "$WAIT_MIN" -eq 0 ]; then WAIT_MIN=10; fi
          SLEEP_SEC=$((WAIT_MIN * 60 - SEC))
          if [ "$SLEEP_SEC" -lt 60 ]; then SLEEP_SEC=$((SLEEP_SEC + 600)); fi

          echo "Sleeping ${SLEEP_SEC}s before self-dispatch..."
          sleep "$SLEEP_SEC"

          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GH_REPO}/actions/workflows/collector.yml/dispatches" \
            -d "{\"ref\":\"${GH_REF}\"}"

          echo "Next workflow run dispatched."
