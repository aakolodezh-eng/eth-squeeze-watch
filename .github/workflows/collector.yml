name: ETH Coinalyze Collector

on:
  workflow_dispatch:

  schedule:
    - cron: "2 * * * *"

permissions:
  contents: write

concurrency:
  group: eth-coinalyze-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 58

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Collect until expected closed hour exists
        env:
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          TARGET_HOUR="$(date -u -d '1 hour ago' '+%Y-%m-%d %H:00')"
          echo "Expected closed bucket: ${TARGET_HOUR} UTC"

          FOUND=0

          for ATTEMPT in $(seq 1 11); do
            echo "Collector attempt ${ATTEMPT}/11"
            python collector.py

            if grep -q ",${TARGET_HOUR}," eth_hourly.csv; then
              echo "Found expected bucket ${TARGET_HOUR} UTC"
              FOUND=1
              break
            fi

            if [ "${ATTEMPT}" -lt 11 ]; then
              echo "Bucket not available yet. Retrying in 5 minutes..."
              sleep 300
            fi
          done

          if [ "${FOUND}" -ne 1 ]; then
            echo "ERROR: expected bucket ${TARGET_HOUR} UTC was not collected after 11 attempts"
            exit 1
          fi

      - name: Commit updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eth_hourly.csv
          git diff --cached --quiet || git commit -m "Update ETH hourly data"
          git push
